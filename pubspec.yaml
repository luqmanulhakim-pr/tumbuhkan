name: tumbuhkan
description: "Smart IoT Hydroponics System"
publish_to: "none" 

version: 1.0.0+1

environment:
  sdk: ">=3.5.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # MQTT Client
  mqtt_client: ^10.2.1

  # State Management
  provider: ^6.1.1

  # Charts
  fl_chart: ^0.68.0

  # SVG Support
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  rive: ^0.13.20
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Utils
  intl: ^0.19.0

  # Camera Hardware
  camera: ^0.10.5+5

  # Networking
  http: ^1.2.0

  flutter_mjpeg: ^2.0.4

  google_generative_ai: ^0.4.0

  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  http: ^1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/rive/
