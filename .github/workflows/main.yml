name: Build Flutter App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      # Build APK dengan menyuntikkan API Key dari Secrets
      - name: Build APK
        run: flutter build apk --release --dart-define=API_KEY_GEMINI=${{ secrets.API_KEY_GEMINI }}

      # (Opsional) Upload artifact agar bisa didownload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
